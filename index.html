            event.preventDefault();

          var _fetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _fetch; },
              set: function(fn) { _fetch = fn; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              if (typeof Window !== 'undefined' && Window.prototype) {

                  get: function() { return _fetch; },
                  set: function(fn) { _fetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
